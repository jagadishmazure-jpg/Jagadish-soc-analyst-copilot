[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc_copilot"
version = "0.1.0"
description = "Natural-language SOC investigation agent: ask in English, get query plans, findings, and hunt steps"
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["soc_copilot"]
