[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc_copilot"
version = "0.1.0"
description = "Natural-language SOC investigation agent: ask in English, get query plans, findings, and hunt steps"
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["soc_copilot"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
